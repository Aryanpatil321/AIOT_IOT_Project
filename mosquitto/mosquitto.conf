# AIoT Predictive Safety System - Mosquitto Broker Configuration (local dev)

# Standard MQTT over TCP (ESP32 + ML service)
listener 1883
protocol mqtt

# WebSocket listener (browser dashboard / MQTT-over-WS clients)
listener 9001
protocol websockets

# Local development only: allow anonymous connections.
# WARNING: Never expose this configuration to a public network.
allow_anonymous true

# Persistence (optional, enable for broker restarts)
# persistence true
# persistence_location ./data/

# Logging
log_type error
log_type warning
log_type notice
log_dest stdout